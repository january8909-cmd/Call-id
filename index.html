<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Call</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#fff;font-family:Arial,sans-serif}
header{height:60px;background:#11151d;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.status{font-size:13px;color:#b8c0cc}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d27d;margin-right:7px}
.stage{position:relative;height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;background:#000}
#mainVideo{width:100%;height:100%;object-fit:contain;background:#000}
#selfView{position:absolute;right:18px;bottom:18px;width:190px;height:135px;object-fit:cover;background:#222;border-radius:12px;border:2px solid #fff}
.controls{height:60px;background:#11151d;display:flex;justify-content:center;align-items:center;gap:12px}
button{border:0;border-radius:25px;padding:12px 20px;background:#2b313d;color:#fff}
button.end{background:#d94343}
#join{position:fixed;inset:0;background:#080a0f;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:430px;width:100%;background:#151a23;border-radius:18px;padding:28px;text-align:center}
.card p{color:#b9c2cf;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body>
<header><strong>Video Call</strong><span class="status"><span class="dot"></span>Connected</span></header>
<div class="stage">
  <video id="mainVideo" src="/video.mp4" playsinline controlslist="nodownload" preload="auto"></video>
  <video id="selfView" autoplay muted playsinline></video>
</div>
<div class="controls">
  <button id="camera">Camera</button>
  <button class="end" id="leave">Leave</button>
</div>

<div id="join">
  <div class="card">
    <h1>Join Video Call</h1>
    <p>Allow camera access to appear in the video-call window.</p>
    <button id="start">Join call</button>
  </div>
</div>

<script>
const mainVideo=document.getElementById("mainVideo");
const selfView=document.getElementById("selfView");
const join=document.getElementById("join");

document.getElementById("start").onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    selfView.srcObject=stream;
    join.classList.add("hidden");
    await mainVideo.play();
  }catch(e){
    alert("Camera permission is required to join the call.");
  }
};

document.getElementById("camera").onclick=()=>{
  selfView.style.display = selfView.style.display==="none" ? "block" : "none";
};

document.getElementById("leave").onclick=()=>{
  if(selfView.srcObject) selfView.srcObject.getTracks().forEach(t=>t.stop());
  mainVideo.pause();
  join.classList.remove("hidden");
};
</script>
</body>
</html>
